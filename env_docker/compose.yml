services:
  sciurus-jazzy:
    build:
      context: ..
      dockerfile: env_docker/Dockerfile
    container_name: sciurus-jazzy
    network_mode: "host"
    environment:
      - ROS_DOMAIN_ID=117
      - ROS_LOCALHOST_ONLY=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///ros2_ws/cyclonedds_profile.xml
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      # NVIDIA GPUを使う場合 (下の deploy ブロックも有効化する)
      # - NVIDIA_VISIBLE_DEVICES=all
      # - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /etc/udev/rules.d:/etc/udev/rules.d
      - /dev:/dev
      - ../additional_rospkgs:/ros2_ws/src/additional_rospkgs
    privileged: true
    tty: true
    stdin_open: true

    # NVIDIA GPUを使う場合 (nvidia-container-toolkit が必要)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

    #command: bash
    # jazzy版では launch 内で use_sim_time:=true が設定される
    command: ros2 launch sciurus17_gazebo sciurus17_gazebo.launch.py

    # test_command -> ros2 launch sciurus17_examples example.launch.py example:='pick_and_place_right_arm_waist' use_sim_time:='true'
